name: Publicar imagen docker en dockerhub

on:
  push:
    branches:
      - aws


jobs:
  build-and-push-to-aws:
    runs-on: ubuntu-latest


    steps:
      - name: Descargar código del repo
        uses: actions/checkout@v4

      - name: Configurar las credenciales de aws
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION }}


      - name: Iniciar sesion en aws ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Construir y publicar
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ step.login-ecr.outputs.registry-url }}/ms-productos:latest

